<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Marcos — Backend Engineer">
  <defs>
    <radialGradient id="vignette" cx="0.35" cy="0.5" r="0.85">
      <stop offset="0%" stop-color="#131316"/>
      <stop offset="55%" stop-color="#08080A"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="bloodRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B0000" stop-opacity="0"/>
      <stop offset="20%" stop-color="#B01030" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#B01030" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B0000" stop-opacity="0"/>
    </linearGradient>
    <filter id="halo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="4"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#vignette)"/>

    <!-- cathedral arcade -->
    <g fill="none" stroke="#B01030" stroke-opacity="0.13" stroke-width="1.5">
      <path d="M868 300 L868 150 Q868 84 928 52 Q988 84 988 150 L988 300"/>
      <path d="M1000 300 L1000 150 Q1000 84 1060 52 Q1120 84 1120 150 L1120 300"/>
      <path d="M898 300 L898 158 Q898 104 928 88 Q958 104 958 158 L958 300" stroke-opacity="0.08"/>
      <path d="M1030 300 L1030 158 Q1030 104 1060 88 Q1090 104 1090 158 L1090 300" stroke-opacity="0.08"/>
    </g>

    <!-- ligature watermark -->
    <text x="1000" y="248" font-family="Georgia, Times New Roman, serif" font-size="215"
          font-weight="700" font-style="italic" fill="#B01030" fill-opacity="0.10"
          text-anchor="middle" letter-spacing="-10">Mz</text>

    <!-- left double rule -->
    <rect x="66" y="86" width="3" height="130" fill="#B01030" fill-opacity="0.9"/>
    <rect x="74" y="86" width="1" height="130" fill="#B01030" fill-opacity="0.4"/>

    <!-- upper ornamental rule -->
    <line x1="66" y1="56" x2="1134" y2="56" stroke="url(#bloodRule)" stroke-width="1.5"
          stroke-dasharray="1068" stroke-dashoffset="1068">
      <animate attributeName="stroke-dashoffset" from="1068" to="0" dur="1.8s" fill="freeze"/>
    </line>
    <path d="M600 48 L608 56 L600 64 L592 56 Z" fill="#B01030"/>

    <!-- name with crimson halo -->
    <text x="102" y="150" font-family="Georgia, Times New Roman, serif" font-size="66"
          font-weight="700" fill="#8B0000" letter-spacing="12" filter="url(#halo)"
          opacity="0.75">MARCOS</text>
    <text x="102" y="150" font-family="Georgia, Times New Roman, serif" font-size="66"
          font-weight="700" fill="#EDE7E7" letter-spacing="12">MARCOS</text>

    <!-- inner divider -->
    <g>
      <line x1="104" y1="176" x2="700" y2="176" stroke="#B01030" stroke-opacity="0.45" stroke-width="1"/>
      <path d="M712 170 L718 176 L712 182 L706 176 Z" fill="#B01030" fill-opacity="0.7"/>
    </g>

    <text x="104" y="206" font-family="Georgia, Times New Roman, serif" font-size="17"
          fill="#B01030" letter-spacing="4.2">BACKEND ENGINEER &#8224; NODE.JS &#8224; NESTJS &#8224; TYPESCRIPT &#8224; LLM</text>

    <text x="104" y="248" font-family="Georgia, Times New Roman, serif" font-size="14"
          fill="#7A7480" letter-spacing="6.5" font-style="italic">build &#183; ship &#183; automate &#183; repeat</text>

    <!-- votive flicker -->
    <circle cx="72" cy="243" r="4" fill="#B01030">
      <animate attributeName="fill-opacity" values="1;0.2;0.85;0.35;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>

    <!-- lower rule + falling drop -->
    <rect x="0" y="294" width="1200" height="2" fill="#8B0000" fill-opacity="0.85"/>
    <circle cx="330" cy="296" r="3" fill="#B01030">
      <animate attributeName="cy" values="296;300;296" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
